name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  # Unit tests gate the deploy.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd client && npm install

      - name: Unit tests
        run: cd client && npm test

  # ── 2. Deploy ──────────────────────────────────────────────────────────────
  # Only runs when test job succeeds.
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: cd client && npm install

      - name: Build
        env:
          # Real, deployed xpacenode instance (spaxerail/docs/deployment/current-nodes.md).
          # Baked in at build time -- Vite env vars aren't read at runtime.
          # Falls back to DHT signaling automatically if either is unset, so
          # this is safe to leave blank while no real node exists.
          VITE_XPACENODE_URL: ${{ vars.VITE_XPACENODE_URL }}
          VITE_XPACENODE_API_URL: ${{ vars.VITE_XPACENODE_API_URL }}
        run: cd client && npm run build

      # ── Deploy to GitHub Pages ────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          commit_message: "deploy: ${{ github.sha }}"
          cname: spacework.spacevilla.xyz

      # ── Compute IPFS CID (offline, no account needed) ─────────────────────
      - name: Compute IPFS CID
        id: ipfs
        run: |
          KUBO_VERSION="v0.32.1"
          wget -qO kubo.tar.gz \
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          tar -xzf kubo.tar.gz
          sudo ./kubo/install.sh
          ipfs init --profile=lowpower
          CID=$(ipfs add -r --cid-version=1 -Q --offline ./client/dist)
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      # ── Job summary ───────────────────────────────────────────────────────
      - name: Write deploy summary
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          CID="${{ steps.ipfs.outputs.cid }}"
          SHA="${{ github.sha }}"

          echo "## 🚀 SpaceWork deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "| Room | Link |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Default | https://${OWNER}.github.io/${REPO}/#main |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Share with team | \`https://${OWNER}.github.io/${REPO}/#your-room-name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### IPFS Content Hash" >> "$GITHUB_STEP_SUMMARY"
          echo "This build's CID (content-addressed, self-verifying):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$CID" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it any time: \`ipfs pin add $CID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
