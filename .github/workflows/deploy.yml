name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: write      # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build
        run: cd client && npm run build
        env:
          # Sets the Vite base path to /spacework/ so assets load correctly
          # on GitHub Pages (github.com/<user>/spacework).
          # If you use a custom domain or root-level Pages, remove this line.
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      # ── GitHub Pages ──────────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          commit_message: "deploy: ${{ github.sha }}"

      # ── IPFS via Pinata (optional) ────────────────────────────────────────
      # Only runs when PINATA_API_KEY and PINATA_SECRET_API_KEY are set
      # in repo Settings → Secrets and variables → Actions.
      # Get free API keys at https://app.pinata.cloud
      - name: Pin to IPFS via Pinata
        id: ipfs
        if: ${{ secrets.PINATA_API_KEY != '' }}
        uses: aquiladev/ipfs-action@v0.3.1
        with:
          path: ./client/dist
          service: pinata
          pinataKey: ${{ secrets.PINATA_API_KEY }}
          pinataSecret: ${{ secrets.PINATA_SECRET_API_KEY }}
          pinataPinName: spacework-${{ github.sha }}

      - name: Print IPFS CID
        if: steps.ipfs.outputs.hash != ''
        run: |
          echo "IPFS CID: ${{ steps.ipfs.outputs.hash }}"
          echo "Gateway:  https://gateway.pinata.cloud/ipfs/${{ steps.ipfs.outputs.hash }}"
          echo "Gateway:  https://cloudflare-ipfs.com/ipfs/${{ steps.ipfs.outputs.hash }}"
