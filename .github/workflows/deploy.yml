name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node ──────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 3. Build ─────────────────────────────────────────────────────────────
      - name: Install dependencies
        run: cd client && npm install

      - name: Build
        run: cd client && npm run build
        # vite.config.js uses base: './' so all asset paths are relative.
        # This works on GitHub Pages (served at /spacework/) without needing
        # the repo name hardcoded, and also works on IPFS gateways.

      # ── 4. Deploy to GitHub Pages ────────────────────────────────────────────
      # Pushes client/dist to the gh-pages branch.
      # GitHub Pages then serves it at: https://xpacenet.github.io/spacework/
      #
      # Hash routing (#room-name) is handled entirely in the browser so
      # no 404 redirect tricks are needed — it just works.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
          commit_message: "deploy: ${{ github.sha }}"

      # ── 5. Compute IPFS CID (no pinning service needed) ──────────────────────
      # Installs Kubo locally in the CI runner, adds the built files in
      # offline mode (no network, no account), and prints the CID.
      #
      # The CID is the cryptographic hash of the exact content that was deployed.
      # Anyone can verify it. If you later want to pin it to IPFS, this is the
      # address to use — via your local node, Pinata, Storacha, or any service.
      - name: Compute IPFS CID
        id: ipfs
        run: |
          KUBO_VERSION="v0.32.1"
          wget -qO kubo.tar.gz \
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          tar -xzf kubo.tar.gz
          sudo ./kubo/install.sh
          ipfs init --profile=lowpower

          # --offline: compute CID from content locally, no daemon or network needed
          # --cid-version=1: produces a bafybei... CIDv1 (shorter, case-insensitive)
          # -Q: quiet — only print the root CID
          CID=$(ipfs add -r --cid-version=1 -Q --offline ./client/dist)
          echo "cid=$CID" >> "$GITHUB_OUTPUT"

      # ── 6. Job summary ───────────────────────────────────────────────────────
      - name: Write deploy summary
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          CID="${{ steps.ipfs.outputs.cid }}"
          SHA="${{ github.sha }}"

          echo "## 🚀 SpaceWork deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "| Room | Link |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Default | https://${OWNER}.github.io/${REPO}/#main |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Share with team | \`https://${OWNER}.github.io/${REPO}/#your-room-name\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### IPFS Content Hash" >> "$GITHUB_STEP_SUMMARY"
          echo "This build's CID (content-addressed, self-verifying):" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$CID" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it any time: \`ipfs pin add $CID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
